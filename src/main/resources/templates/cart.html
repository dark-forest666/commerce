<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>购物车 - Commerce</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .cart-item-select {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            cursor: pointer;
        }
        .cart-item-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quantity-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1.5px solid var(--gray-200);
            background: #fff;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .quantity-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .quantity-input {
            width: 60px;
            text-align: center;
            padding: 8px;
            border: 1.5px solid var(--gray-200);
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .cart-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--gray-100);
            margin-top: 20px;
        }
        .cart-total {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--danger);
        }
        .cart-actions {
            display: flex;
            gap: 12px;
        }
        
        @media (max-width: 768px) {
            .cart-footer {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div th:replace="fragments :: navbar(${session.role})"></div>

<section class="page-header">
    <div class="container">
        <h1>购物车</h1>
        <p>管理您的购物清单</p>
    </div>
</section>

<div class="container">
    <div th:if="${#lists.isEmpty(cartItems)}" class="empty-state">
        <div class="empty-state-icon">🛒</div>
        <div class="empty-state-text">购物车空空如也</div>
        <a href="/products" class="btn btn-primary">去购物</a>
    </div>
    
    <div th:unless="${#lists.isEmpty(cartItems)}">
        <div class="table-wrap">
            <table id="cartTable">
                <thead>
                <tr>
                    <th><input type="checkbox" id="selectAll" class="cart-item-select" style="margin: 0;"></th>
                    <th>商品</th>
                    <th>单价</th>
                    <th>数量</th>
                    <th>小计</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cartItems}" th:data-id="${item.id}">
                    <td>
                        <input type="checkbox" class="cart-item-select" th:checked="${item.selected}" th:data-id="${item.id}" style="margin: 0;">
                    </td>
                    <td style="display: flex; align-items: center; gap: 12px;">
                        <img class="cart-item-img" th:src="${item.product.imageUrl}" alt="商品图片">
                        <span th:text="${item.product.name}"></span>
                    </td>
                    <td style="font-weight: 600;">￥<span class="unit-price" th:text="${item.product.price}"></span></td>
                    <td>
                        <div class="quantity-control">
                            <button class="quantity-btn decr-btn" th:data-id="${item.id}">-</button>
                            <input type="number" class="quantity-input" th:data-id="${item.id}" th:value="${item.quantity}" min="1">
                            <button class="quantity-btn incr-btn" th:data-id="${item.id}">+</button>
                        </div>
                    </td>
                    <td style="font-weight: 700; color: var(--danger);">￥<span class="subtotal" th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 1, 2)}"></span></td>
                    <td>
                        <button class="btn btn-danger btn-sm remove-btn" th:data-id="${item.id}">删除</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        
        <div class="cart-footer">
            <div>
                <button class="btn btn-secondary btn-sm" id="selectAllBtn">全选</button>
                <button class="btn btn-secondary btn-sm" id="unselectAllBtn" style="margin-left: 8px;">取消全选</button>
            </div>
            <div class="cart-actions">
                <span class="cart-total">选中商品总价：<span id="totalPriceSpan" th:text="'￥' + ${totalPrice}"></span></span>
                <a href="/products" class="btn btn-secondary">继续购物</a>
                <a href="/order/checkout" class="btn btn-primary">去结算</a>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        var contextPath = /*[[@{/}]]*/ '';

        function updateTotal() {
            let total = 0;
            document.querySelectorAll('#cartTable tbody tr').forEach(row => {
                const checkbox = row.querySelector('.cart-item-select');
                if (checkbox.checked) {
                    const subtotalText = row.querySelector('.subtotal').innerText;
                    const subtotal = parseFloat(subtotalText.replace('￥', ''));
                    if (!isNaN(subtotal)) total += subtotal;
                }
            });
            document.getElementById('totalPriceSpan').innerText = '￥' + total.toFixed(2);
        }

        function updateSubtotal(row, quantity, price) {
            const subtotal = (quantity * price).toFixed(2);
            row.querySelector('.subtotal').innerText = '￥' + subtotal;
            updateTotal();
        }

        function sendUpdate(cartItemId, quantity, callback) {
            fetch(contextPath + 'cart/updateAjax', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'cartItemId=' + cartItemId + '&quantity=' + quantity
            }).then(response => {
                if (response.ok && callback) callback();
                else alert('更新失败');
            }).catch(err => alert('网络错误'));
        }

        function sendToggleSelect(cartItemId, selected, callback) {
            fetch(contextPath + 'cart/toggleSelectAjax', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'cartItemId=' + cartItemId + '&selected=' + selected
            }).then(response => {
                if (response.ok && callback) callback();
                else alert('操作失败');
            }).catch(err => alert('网络错误'));
        }

        function sendRemove(cartItemId, callback) {
            fetch(contextPath + 'cart/removeAjax', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'cartItemId=' + cartItemId
            }).then(response => {
                if (response.ok && callback) callback();
                else alert('删除失败');
            }).catch(err => alert('网络错误'));
        }

        function bindEvents() {
            document.querySelectorAll('.quantity-input').forEach(input => {
                input.removeEventListener('change', handleQuantityChange);
                input.addEventListener('change', handleQuantityChange);
            });
            document.querySelectorAll('.incr-btn').forEach(btn => {
                btn.removeEventListener('click', handleIncr);
                btn.addEventListener('click', handleIncr);
            });
            document.querySelectorAll('.decr-btn').forEach(btn => {
                btn.removeEventListener('click', handleDecr);
                btn.addEventListener('click', handleDecr);
            });
            document.querySelectorAll('.cart-item-select').forEach(checkbox => {
                checkbox.removeEventListener('change', handleToggleSelect);
                checkbox.addEventListener('change', handleToggleSelect);
            });
            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.removeEventListener('click', handleRemove);
                btn.addEventListener('click', handleRemove);
            });
        }

        function handleQuantityChange(e) {
            let input = e.target;
            let cartItemId = input.getAttribute('data-id');
            let newQty = parseInt(input.value);
            if (isNaN(newQty) || newQty < 1) newQty = 1;
            input.value = newQty;
            let row = input.closest('tr');
            let price = parseFloat(row.querySelector('.unit-price').innerText);
            sendUpdate(cartItemId, newQty, () => {
                updateSubtotal(row, newQty, price);
            });
        }

        function handleIncr(e) {
            let btn = e.target;
            let input = btn.parentNode.querySelector('.quantity-input');
            input.value = parseInt(input.value) + 1;
            input.dispatchEvent(new Event('change'));
        }

        function handleDecr(e) {
            let btn = e.target;
            let input = btn.parentNode.querySelector('.quantity-input');
            let val = parseInt(input.value);
            if (val > 1) input.value = val - 1;
            input.dispatchEvent(new Event('change'));
        }

        function handleToggleSelect(e) {
            let checkbox = e.target;
            let cartItemId = checkbox.getAttribute('data-id');
            let newSelected = checkbox.checked;
            sendToggleSelect(cartItemId, newSelected, () => {
                let row = checkbox.closest('tr');
                let quantity = parseInt(row.querySelector('.quantity-input').value);
                let price = parseFloat(row.querySelector('.unit-price').innerText);
                updateSubtotal(row, quantity, price);
            });
        }

        function handleRemove(e) {
            if (!confirm('确定删除该商品吗？')) return;
            let btn = e.target.closest('.remove-btn');
            let cartItemId = btn.getAttribute('data-id');
            let row = btn.closest('tr');
            sendRemove(cartItemId, () => {
                row.remove();
                updateTotal();
                if (document.querySelectorAll('#cartTable tbody tr').length === 0) {
                    window.location.reload();
                }
            });
        }

        document.getElementById('selectAll').addEventListener('change', function() {
            document.querySelectorAll('.cart-item-select').forEach(checkbox => {
                checkbox.checked = this.checked;
                checkbox.dispatchEvent(new Event('change'));
            });
        });

        document.getElementById('selectAllBtn').addEventListener('click', function() {
            document.querySelectorAll('.cart-item-select').forEach(checkbox => {
                checkbox.checked = true;
                checkbox.dispatchEvent(new Event('change'));
            });
        });

        document.getElementById('unselectAllBtn').addEventListener('click', function() {
            document.querySelectorAll('.cart-item-select').forEach(checkbox => {
                checkbox.checked = false;
                checkbox.dispatchEvent(new Event('change'));
            });
        });

        bindEvents();
        updateTotal();
    })();
</script>
</body>
</html>
