<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>购物车</title>
    <style>
        table { border-collapse: collapse; width: 80%; margin: auto; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; vertical-align: middle; }
        .product-img { width: 60px; height: 60px; object-fit: cover; }
        .total { text-align: right; margin-top: 20px; font-size: 1.2em; }
        .btn { margin: 0 5px; cursor:pointer; }
        .quantity-input { width: 60px; text-align: center; }
    </style>
</head>
<body>
<div th:replace="fragments :: navbar(${session.role})"></div>

<h2>购物车</h2>
<table id="cartTable">
    <thead>
    <tr><th>选中</th><th>图片</th><th>商品</th><th>单价</th><th>数量</th><th>小计</th><th>操作</th></tr>
    </thead>
    <tbody>
    <tr th:each="item : ${cartItems}" th:data-id="${item.id}">
        <td class="select-cell">
            <button class="toggle-select-btn" th:data-id="${item.id}" th:data-selected="${item.selected}">
                <span th:text="${item.selected} ? '✅' : '⬜'"></span>
            </button>
        </td>
        <td><img class="product-img" th:src="${item.product.imageUrl}" alt="商品图片"></td>
        <td th:text="${item.product.name}"></td>
        <td class="unit-price" th:text="${item.product.price}"></td>
        <td>
            <button class="decr-btn" th:data-id="${item.id}">-</button>
            <input type="number" class="quantity-input" th:data-id="${item.id}" th:value="${item.quantity}" min="1" style="width:60px;">
            <button class="incr-btn" th:data-id="${item.id}">+</button>
        </td>
        <td class="subtotal" th:text="'￥' + ${item.product.price * item.quantity}"></td>
        <td>
            <button class="remove-btn" th:data-id="${item.id}">删除</button>
        </td>
    </tr>
    </tbody>
</table>
<div class="total">
    选中商品总价：<span id="totalPriceSpan" th:text="'￥' + ${totalPrice}"></span>
</div>
<div style="text-align:center; margin-top:20px;">
    <a href="/products">继续购物</a> | <a href="/order/checkout">去结算</a>
</div>

<script>
    (function() {
        // 获取 contextPath（如果需要）
        var contextPath = /*[[@{/}]]*/ '';

        function updateTotal() {
            let total = 0;
            document.querySelectorAll('#cartTable tbody tr').forEach(row => {
                const toggleBtn = row.querySelector('.toggle-select-btn');
                const isSelected = toggleBtn.getAttribute('data-selected') === 'true';
                if (isSelected) {
                    const subtotalText = row.querySelector('.subtotal').innerText;
                    const subtotal = parseFloat(subtotalText.replace('￥', ''));
                    if (!isNaN(subtotal)) total += subtotal;
                }
            });
            document.getElementById('totalPriceSpan').innerText = '￥' + total.toFixed(2);
        }

        function updateSubtotal(row, quantity, price) {
            const subtotal = (quantity * price).toFixed(2);
            row.querySelector('.subtotal').innerText = '￥' + subtotal;
            updateTotal();
        }

        function sendUpdate(cartItemId, quantity, callback) {
            fetch(contextPath + 'cart/updateAjax', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'cartItemId=' + cartItemId + '&quantity=' + quantity
            }).then(response => {
                if (response.ok && callback) callback();
                else alert('更新失败');
            }).catch(err => alert('网络错误'));
        }

        function sendToggleSelect(cartItemId, selected, callback) {
            fetch(contextPath + 'cart/toggleSelectAjax', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'cartItemId=' + cartItemId + '&selected=' + selected
            }).then(response => {
                if (response.ok && callback) callback();
                else alert('操作失败');
            }).catch(err => alert('网络错误'));
        }

        function sendRemove(cartItemId, callback) {
            fetch(contextPath + 'cart/removeAjax', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'cartItemId=' + cartItemId
            }).then(response => {
                if (response.ok && callback) callback();
                else alert('删除失败');
            }).catch(err => alert('网络错误'));
        }

        // 绑定事件
        function bindEvents() {
            // 数量变化
            document.querySelectorAll('.quantity-input').forEach(input => {
                input.removeEventListener('change', handleQuantityChange);
                input.addEventListener('change', handleQuantityChange);
            });
            // + 按钮
            document.querySelectorAll('.incr-btn').forEach(btn => {
                btn.removeEventListener('click', handleIncr);
                btn.addEventListener('click', handleIncr);
            });
            // - 按钮
            document.querySelectorAll('.decr-btn').forEach(btn => {
                btn.removeEventListener('click', handleDecr);
                btn.addEventListener('click', handleDecr);
            });
            // 选中按钮
            document.querySelectorAll('.toggle-select-btn').forEach(btn => {
                btn.removeEventListener('click', handleToggleSelect);
                btn.addEventListener('click', handleToggleSelect);
            });
            // 删除按钮
            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.removeEventListener('click', handleRemove);
                btn.addEventListener('click', handleRemove);
            });
        }

        function handleQuantityChange(e) {
            let input = e.target;
            let cartItemId = input.getAttribute('data-id');
            let newQty = parseInt(input.value);
            if (isNaN(newQty) || newQty < 1) newQty = 1;
            input.value = newQty;
            let row = input.closest('tr');
            let price = parseFloat(row.querySelector('.unit-price').innerText);
            sendUpdate(cartItemId, newQty, () => {
                updateSubtotal(row, newQty, price);
            });
        }

        function handleIncr(e) {
            let btn = e.target;
            let input = btn.parentNode.querySelector('.quantity-input');
            input.value = parseInt(input.value) + 1;
            input.dispatchEvent(new Event('change'));
        }

        function handleDecr(e) {
            let btn = e.target;
            let input = btn.parentNode.querySelector('.quantity-input');
            let val = parseInt(input.value);
            if (val > 1) input.value = val - 1;
            input.dispatchEvent(new Event('change'));
        }

        function handleToggleSelect(e) {
            let btn = e.target.closest('.toggle-select-btn');
            let cartItemId = btn.getAttribute('data-id');
            let currentSelected = btn.getAttribute('data-selected') === 'true';
            let newSelected = !currentSelected;
            sendToggleSelect(cartItemId, newSelected, () => {
                btn.setAttribute('data-selected', newSelected);
                btn.querySelector('span').innerText = newSelected ? '✅' : '⬜';
                let row = btn.closest('tr');
                let quantity = parseInt(row.querySelector('.quantity-input').value);
                let price = parseFloat(row.querySelector('.unit-price').innerText);
                updateSubtotal(row, quantity, price);
            });
        }

        function handleRemove(e) {
            if (!confirm('确定删除该商品吗？')) return;
            let btn = e.target.closest('.remove-btn');
            let cartItemId = btn.getAttribute('data-id');
            let row = btn.closest('tr');
            sendRemove(cartItemId, () => {
                row.remove();
                updateTotal();
            });
        }

        bindEvents();
        // 如果表格动态更新，需要重新绑定，这里没有动态增加行，无需重复绑定
        updateTotal();
    })();
</script>
</body>
</html>
