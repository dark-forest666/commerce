<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>确认订单 - Commerce</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div th:replace="fragments :: navbar(${session.role})"></div>

<section class="page-header">
    <div class="container">
        <h1>确认订单</h1>
        <p>核对订单信息，准备提交</p>
    </div>
</section>

<div class="container">
    <div class="card" style="margin-bottom: 20px;">
        <div class="card-header">选择收货地址</div>
        <div class="card-body">
            <form th:action="@{/order/create}" method="post">
                <div th:each="addr : ${addresses}" style="padding: 16px; border: 2px solid var(--gray-100); border-radius: var(--radius-sm); margin-bottom: 12px; cursor: pointer; transition: var(--transition);">
                    <label style="display: flex; align-items: center; gap: 12px;">
                        <input type="radio" name="addressId" th:value="${addr.id}" th:checked="${addr.isDefault}" required style="width: 20px; height: 20px;">
                        <div style="flex: 1;">
                            <div style="font-weight: 600; margin-bottom: 4px;">
                                <span th:text="${addr.receiverName}"></span>
                                <span style="color: var(--gray-500); margin-left: 12px;" th:text="${addr.phone}"></span>
                            </div>
                            <div style="color: var(--gray-600); font-size: 0.9rem;">
                                <span th:text="${addr.province}"></span>
                                <span th:text="${addr.city}"></span>
                                <span th:text="${addr.district}"></span>
                                <span th:text="${addr.detail}"></span>
                                <span th:if="${addr.isDefault}" style="color: var(--primary); font-weight: 600; margin-left: 8px;">【默认】</span>
                            </div>
                        </div>
                    </label>
                </div>
                
                <hr style="margin: 24px 0; border: none; border-top: 1px solid var(--gray-200);">
                
                <div class="card" style="margin-bottom: 20px; border: none; box-shadow: none;">
                    <div class="card-header" style="background: transparent; border-bottom: 1px solid var(--gray-100);">商品清单</div>
                    <div class="card-body">
                        <div class="table-wrap">
                            <table>
                                <thead>
                                <tr>
                                    <th>商品</th>
                                    <th>单价</th>
                                    <th>数量</th>
                                    <th>小计</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="item : ${selectedItems}">
                                    <td th:text="${item.product.name}"></td>
                                    <td>￥<span th:text="${item.product.price}"></span></td>
                                    <td th:text="${item.quantity}"></td>
                                    <td style="font-weight: 700; color: var(--danger);">￥<span th:text="${item.product.price * item.quantity}"></span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <span style="font-size: 1.25rem; font-weight: 700; color: var(--danger);">总金额：￥<span th:text="${totalPrice}"></span></span>
                    <div>
                        <a href="/cart" class="btn btn-secondary" style="margin-right: 12px;">返回修改</a>
                        <button type="submit" class="btn btn-primary">提交订单</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
