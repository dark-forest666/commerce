<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>订单支付 - Commerce</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-mesh">
    <div th:replace="fragments :: navbar(${session.role})"></div>
    
    <div class="container" style="max-width: 520px; margin: 0 auto; padding: 40px 20px;">
        <div class="card" style="overflow: hidden; animation: fadeInUp 0.5s ease-out;">
            <div style="background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 36px; text-align: center;">
                <div style="width: 80px; height: 80px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <h1 style="color: white; font-size: 1.6rem; font-weight: 700; margin-bottom: 8px;">订单创建成功</h1>
                <p style="color: rgba(255,255,255,0.85); font-size: 0.95rem;">请尽快完成支付</p>
            </div>
            
            <div class="card-body" style="padding: 32px;">
                <div style="background: var(--gray-50); border-radius: var(--radius-sm); padding: 20px; margin-bottom: 24px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--gray-200);">
                        <span style="color: var(--gray-500); font-size: 0.9rem;">订单编号</span>
                        <span style="font-family: monospace; font-weight: 600; color: var(--gray-800);" th:text="${order.orderNo}"></span>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0;">
                        <span style="color: var(--gray-500); font-size: 0.9rem;">订单金额</span>
                        <span style="font-size: 1.5rem; font-weight: 800; color: var(--danger);">￥<span th:text="${order.totalAmount}"></span></span>
                    </div>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <a th:href="@{/pay/page(orderId=${order.id})}" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">
                        立即支付
                    </a>
                    <a th:href="@{/order/detail/{id}(id=${order.id})}" class="btn btn-secondary" style="width: 100%; padding: 14px; font-size: 1rem;">
                        查看订单详情
                    </a>
                    <a th:href="@{/order/myOrders}" class="btn btn-outline" style="width: 100%; padding: 14px; font-size: 1rem;">
                        返回订单列表
                    </a>
                </div>
                
                <div style="margin-top: 24px; text-align: center;">
                    <p style="color: var(--gray-400); font-size: 0.85rem;">支付成功后订单状态将自动更新</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
