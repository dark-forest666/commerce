<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的订单</title>
    <style>
        table { width: 80%; margin: auto; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    </style>
</head>
<body>
<div th:replace="fragments :: navbar(${session.role})"></div>
<h2>我的订单</h2>
<table>
    <tr><th>订单号</th><th>总金额</th><th>状态</th><th>创建时间</th><th>操作</th></tr>
    <tr th:each="order : ${orders}">
        <td th:text="${order.orderNo}"></td>
        <td th:text="'￥' + ${order.totalAmount}"></td>
        <td>
            <span th:if="${order.status == 0}">待支付</span>
            <span th:if="${order.status == 1}">已支付</span>
            <span th:if="${order.status == 2}">已发货</span>
            <span th:if="${order.status == 3}">已完成</span>
            <span th:if="${order.status == 4}">已取消</span>
        </td>
        <td th:text="${#dates.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
        <td><a th:href="@{/order/detail/{id}(id=${order.id})}">查看详情</a></td>
    </tr>
</table>
</body>
</html>
