<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注册 - Commerce</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
    <div class="auth-bg-decoration" style="width: 400px; height: 400px; top: -100px; right: -100px; background: #fff;"></div>
    <div class="auth-bg-decoration" style="width: 300px; height: 300px; bottom: -50px; left: -50px; background: #fff;"></div>
    
    <div class="auth-card">
        <div class="auth-title">创建账户</div>
        <div class="auth-subtitle">注册成为会员，享受更多优惠</div>
        
        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>
        
        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" class="form-input" name="username" required placeholder="请输入用户名">
            </div>
            
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" name="password" required placeholder="请输入密码">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">注册</button>
            
            <div style="text-align: center; margin-top: 20px;">
                <span style="color: var(--gray-400); font-size: 0.88rem;">已有账号？</span>
                <a href="/login" style="color: var(--primary); font-weight: 600; text-decoration: none; margin-left: 4px;">去登录</a>
            </div>
        </form>
    </div>
</body>
</html>
