<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${address.id} ? '编辑地址 - Commerce' : '新增地址 - Commerce'">地址表单</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div th:replace="fragments :: navbar(${session.role})"></div>

<section class="page-header">
    <div class="container">
        <h1 th:text="${address.id} ? '编辑地址' : '新增地址'">地址表单</h1>
        <p>管理您的收货地址</p>
    </div>
</section>

<div class="container">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <div class="card-body">
            <form th:action="@{/address/save}" th:object="${address}" method="post">
                <input type="hidden" th:field="*{id}" />
                
                <div class="form-group">
                    <label class="form-label">收货人姓名</label>
                    <input type="text" th:field="*{receiverName}" class="form-input" required placeholder="请输入收货人姓名">
                </div>
                
                <div class="form-group">
                    <label class="form-label">手机号</label>
                    <input type="text" th:field="*{phone}" class="form-input" required placeholder="请输入手机号">
                </div>
                
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">省</label>
                        <input type="text" th:field="*{province}" class="form-input" required placeholder="省">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">市</label>
                        <input type="text" th:field="*{city}" class="form-input" required placeholder="市">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">区/县</label>
                        <input type="text" th:field="*{district}" class="form-input" required placeholder="区/县">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">详细地址</label>
                    <input type="text" th:field="*{detail}" class="form-input" required placeholder="请输入详细地址">
                </div>
                
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" th:field="*{isDefault}" value="true" style="width: 18px; height: 18px;">
                        <span style="font-weight: 600; color: var(--gray-700);">设为默认地址</span>
                    </label>
                </div>
                
                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" class="btn btn-primary flex-1">保存</button>
                    <a href="/address" class="btn btn-secondary flex-1">返回</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
