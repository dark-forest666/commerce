<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品列表</title>
    <style>
        .product {
            border: 1px solid #ccc;
            margin: 10px;
            padding: 10px;
            width: 200px;
            display: inline-block;
            text-align: center;
        }
        .product img {
            width: 150px;
            height: 120px;
            object-fit: cover;
        }
        .price {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
<!-- 引入导航栏，从 session 获取 role -->
<div th:replace="fragments :: navbar(${session.role})"></div>

<h2>商品列表</h2>
<div th:each="p : ${products}" class="product">
    <img th:src="${p.imageUrl}" alt="商品图片"/>
    <h4 th:text="${p.name}">商品名</h4>
    <p class="price" th:text="'￥' + ${p.price}">价格</p>
    <p>库存: <span th:text="${p.stock}"></span></p>
    <p th:text="${p.description}">描述</p>
    <!-- 加入购物车表单 -->
    <form th:action="@{/cart/add}" method="post">
        <input type="hidden" name="productId" th:value="${p.id}" />
        <input type="number" name="quantity" value="1" min="1" style="width:50px;" />
        <button type="submit">加入购物车</button>
    </form>
</div>
</body>
</html>
