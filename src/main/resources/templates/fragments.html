<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div th:fragment="navbar(role)">
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-brand">
                <div class="navbar-brand-icon">C</div>
                <span>Commerce</span>
            </a>
            <div class="navbar-links">
                <a th:href="@{/products}" class="nav-link" th:classappend="${#request.requestURI == '/products'} ? 'active'">
                    <span>商品列表</span>
                </a>
                <a th:href="@{/cart}" class="nav-link" th:classappend="${#request.requestURI == '/cart'} ? 'active'">
                    <span>购物车</span>
                </a>
                <a th:href="@{/order/myOrders}" class="nav-link" th:classappend="${#request.requestURI.startsWith('/order/')} ? 'active'">
                    <span>我的订单</span>
                </a>
                <a th:href="@{/address}" class="nav-link" th:classappend="${#request.requestURI.startsWith('/address')} ? 'active'">
                    <span>我的地址</span>
                </a>
                <a th:if="${role == 'admin'}" th:href="@{/admin/index}" class="nav-link">
                    <span>后台管理</span>
                </a>
                <a th:href="@{/logout}" class="nav-link">
                    <span>退出登录</span>
                </a>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
