<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单详情</title>
    <style>
        table { width: 80%; margin: auto; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        .info { width: 80%; margin: auto; border: 1px solid #ddd; padding: 10px; }
    </style>
</head>
<body>
<div th:replace="fragments :: navbar(${session.role})"></div>
<h2>订单详情</h2>
<div class="info">
    <p>订单号：<span th:text="${order.orderNo}"></span></p>
    <p>订单状态：
        <span th:if="${order.status == 0}">待支付</span>
        <span th:if="${order.status == 1}">已支付</span>
        <span th:if="${order.status == 2}">已发货</span>
        <span th:if="${order.status == 3}">已完成</span>
        <span th:if="${order.status == 4}">已取消</span>
    </p>
    <p>总金额：<span th:text="'￥' + ${order.totalAmount}"></span></p>
    <p>收货地址：<span th:text="${order.address.receiverName} + '，' + ${order.address.phone} + '，' + ${order.address.province} + ${order.address.city} + ${order.address.district} + ${order.address.detail}"></span></p>
    <p>创建时间：<span th:text="${#dates.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
</div>
<h3>商品清单</h3>
<table>
    <tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th></tr>
    <tr th:each="item : ${order.orderItems}">
        <td th:text="${item.product.name}"></td>
        <td th:text="'￥' + ${item.price}"></td>
        <td th:text="${item.quantity}"></td>
        <td th:text="'￥' + ${item.price * item.quantity}"></td>
    </tr>
</table>
<div style="text-align:center; margin-top:20px;">
    <form th:action="@{/order/simulatePay}" method="post" style="display:inline;">
        <input type="hidden" name="orderId" th:value="${order.id}" />
        <button type="submit" th:if="${order.status == 0}">模拟支付</button>
    </form>
    <form th:action="@{/order/cancel}" method="post" style="display:inline;">
        <input type="hidden" name="orderId" th:value="${order.id}" />
        <button type="submit" th:if="${order.status == 0}" onclick="return confirm('确定取消订单吗？');">取消订单</button>
    </form>
    <a href="/order/myOrders">返回我的订单</a>
</div>
</body>
</html>
