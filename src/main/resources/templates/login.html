<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - Commerce</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
    <div class="auth-bg-decoration" style="width: 400px; height: 400px; top: -100px; left: -100px; background: #fff;"></div>
    <div class="auth-bg-decoration" style="width: 300px; height: 300px; bottom: -50px; right: -50px; background: #fff;"></div>
    
    <div class="auth-card">
        <div class="auth-title">欢迎回来</div>
        <div class="auth-subtitle">登录您的账户，开始购物之旅</div>
        
        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>
        
        <form id="loginForm" method="post">
            <div class="form-group">
                <label class="form-label">登录角色</label>
                <select class="form-select" id="role" required>
                    <option value="user">普通用户</option>
                    <option value="admin">管理员</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" class="form-input" id="username" name="username" required placeholder="请输入用户名">
            </div>
            
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" id="password" name="password" required placeholder="请输入密码">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">登录</button>
            
            <div style="text-align: center; margin-top: 20px;">
                <span style="color: var(--gray-400); font-size: 0.88rem;">没有账号？</span>
                <a href="/register" style="color: var(--primary); font-weight: 600; text-decoration: none; margin-left: 4px;">立即注册</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('role').addEventListener('change', function() {
            const form = document.getElementById('loginForm');
            if (this.value === 'admin') {
                form.action = '/admin/login';
            } else {
                form.action = '/login';
            }
        });
        document.getElementById('loginForm').action = '/login';
    </script>
</body>
</html>
