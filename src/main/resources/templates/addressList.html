<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的地址 - Commerce</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .address-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            padding: 0 0 40px;
        }
        .address-card {
            background: #fff;
            border-radius: var(--radius);
            border: 2px solid var(--gray-100);
            padding: 24px;
            transition: var(--transition);
            position: relative;
        }
        .address-card:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow);
        }
        .address-card.default {
            border-color: var(--primary);
            background: rgba(79,70,229,0.03);
        }
        .address-card .default-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--primary);
            color: #fff;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 600;
        }
        .address-card .receiver-info {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .address-card .receiver-phone {
            color: var(--gray-500);
            font-weight: 400;
        }
        .address-card .address-text {
            color: var(--gray-600);
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .address-card .address-actions {
            display: flex;
            gap: 8px;
        }
        
        @media (max-width: 768px) {
            .address-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div th:replace="fragments :: navbar(${session.role})"></div>

<section class="page-header">
    <div class="container">
        <h1>收货地址管理</h1>
        <p>管理您的收货地址</p>
    </div>
</section>

<div class="container">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
        <a href="/address/add" class="btn btn-primary">新增地址</a>
    </div>
    
    <div th:if="${#lists.isEmpty(addresses)}" class="empty-state">
        <div class="empty-state-icon">📍</div>
        <div class="empty-state-text">暂无收货地址</div>
        <a href="/address/add" class="btn btn-primary">新增地址</a>
    </div>
    
    <div th:unless="${#lists.isEmpty(addresses)}" class="address-grid">
        <div th:each="addr : ${addresses}" class="address-card" th:classappend="${addr.isDefault} ? 'default' : ''">
            <div th:if="${addr.isDefault}" class="default-badge">默认地址</div>
            <div class="receiver-info">
                <span th:text="${addr.receiverName}"></span>
                <span class="receiver-phone" th:text="${addr.phone}"></span>
            </div>
            <div class="address-text">
                <span th:text="${addr.province}"></span>
                <span th:text="${addr.city}"></span>
                <span th:text="${addr.district}"></span>
                <span th:text="${addr.detail}"></span>
            </div>
            <div class="address-actions">
                <a th:href="@{/address/edit/{id}(id=${addr.id})}" class="btn btn-secondary btn-sm">编辑</a>
                <a th:href="@{/address/delete/{id}(id=${addr.id})}" class="btn btn-danger btn-sm" onclick="return confirm('确定删除吗？')">删除</a>
                <a th:unless="${addr.isDefault}" th:href="@{/address/setDefault/{id}(id=${addr.id})}" class="btn btn-primary btn-sm">设为默认</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
