<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的地址</title>
    <style>
        .address-card {
            border: 1px solid #ccc;
            margin: 10px;
            padding: 10px;
            width: 400px;
            display: inline-block;
            vertical-align: top;
        }
        .default {
            background-color: #f0f8ff;
            border-color: #00f;
        }
        .btn { margin: 5px; }
    </style>
</head>
<body>
<div th:replace="fragments :: navbar(${session.role})"></div>
<h2>收货地址管理</h2>
<a href="/address/add">新增地址</a>
<div th:each="addr : ${addresses}" class="address-card" th:classappend="${addr.isDefault} ? 'default' : ''">
    <p>收货人：<span th:text="${addr.receiverName}"></span> <span th:text="${addr.phone}"></span></p>
    <p>地址：<span th:text="${addr.province} + ' ' + ${addr.city} + ' ' + ${addr.district} + ' ' + ${addr.detail}"></span></p>
    <p th:if="${addr.isDefault}" style="color:blue;">【默认地址】</p>
    <div>
        <a th:href="@{/address/edit/{id}(id=${addr.id})}" class="btn">编辑</a>
        <a th:href="@{/address/delete/{id}(id=${addr.id})}" class="btn" onclick="return confirm('确定删除吗？')">删除</a>
        <a th:unless="${addr.isDefault}" th:href="@{/address/setDefault/{id}(id=${addr.id})}" class="btn">设为默认</a>
    </div>
</div>
<div th:if="${#lists.isEmpty(addresses)}">
    <p>暂无收货地址，请新增。</p>
</div>
</body>
</html>
