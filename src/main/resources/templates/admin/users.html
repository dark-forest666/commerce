<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户管理 - Commerce 后台</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav th:replace="~{admin/fragments :: navbar}"></nav>

    <div class="admin-content">
        <h2 style="margin-bottom: 24px;">普通用户管理</h2>
        
        <div class="card">
            <div class="card-header">用户列表</div>
            <div class="card-body">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>用户ID</th>
                                <th>用户名</th>
                                <th>注册时间</th>
                                <th>账号状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}">1</td>
                                <td th:text="${user.username}">用户名</td>
                                <td th:text="${#dates.format(user.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
                                <td>
                                    <span th:if="${user.status == 1}" class="badge badge-success">正常</span>
                                    <span th:if="${user.status == 0}" class="badge badge-danger">已禁用</span>
                                </td>
                                <td>
                                    <form th:action="@{/admin/users/toggleStatus}" method="post" style="display:inline;">
                                        <input type="hidden" name="userId" th:value="${user.id}">
                                        <button type="submit" class="btn btn-sm" 
                                                th:classappend="${user.status == 1} ? 'btn-warning' : 'btn-success'"
                                                th:text="${user.status == 1} ? '禁用' : '启用'">禁用</button>
                                    </form>
                                    <form th:action="@{/admin/users/resetPassword}" method="post" style="display:inline;">
                                        <input type="hidden" name="userId" th:value="${user.id}">
                                        <button type="submit" class="btn btn-sm btn-secondary" 
                                                onclick="return confirm('确定重置该用户密码为123456吗？')">重置密码</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
