<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.id} ? '编辑商品 - Commerce 后台' : '新增商品 - Commerce 后台'">商品表单</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav th:replace="~{admin/fragments :: navbar}"></nav>

    <div class="admin-content">
        <h2 style="margin-bottom: 24px;" th:text="${product.id} ? '编辑商品' : '新增商品'">商品表单</h2>
        
        <div class="card" style="max-width: 700px; margin: 0 auto;">
            <div class="card-body">
                <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
                    <input type="hidden" th:field="*{id}" />
                    
                    <div class="form-group">
                        <label class="form-label">商品名称</label>
                        <input type="text" th:field="*{name}" class="form-input" required placeholder="请输入商品名称">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">商品价格</label>
                        <input type="number" th:field="*{price}" class="form-input" step="0.01" min="0.01" required placeholder="请输入商品价格">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">商品库存</label>
                        <input type="number" th:field="*{stock}" class="form-input" min="0" required placeholder="请输入商品库存">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">商品分类</label>
                        <select th:field="*{categoryId}" class="form-select">
                            <option value="">请选择分类</option>
                            <option th:each="category : ${categories}" 
                                    th:value="${category.id}" 
                                    th:text="${category.name}">分类名称</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">商品描述</label>
                        <textarea th:field="*{description}" class="form-textarea" rows="3" placeholder="请输入商品描述"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">商品图片路径</label>
                        <input type="text" th:field="*{imageUrl}" class="form-input" placeholder="/product-images/图片名称.png">
                        <div th:if="${product.imageUrl}" style="margin-top: 12px;">
                            <img th:src="${product.imageUrl}" style="max-width: 200px; max-height: 200px; border-radius: 8px;" />
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">商品状态</label>
                        <div style="display: flex; gap: 24px;">
                            <label style="display: flex; align-items: center; gap: 8px;">
                                <input class="form-check-input" type="radio" th:field="*{status}" value="1" id="status1">
                                <span>上架</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px;">
                                <input class="form-check-input" type="radio" th:field="*{status}" value="0" id="status0">
                                <span>下架</span>
                            </label>
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button type="submit" class="btn btn-primary flex-1">保存商品</button>
                        <a href="/admin/products" class="btn btn-secondary flex-1">返回商品列表</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
