<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.id} ? '编辑商品' : '新增商品'">商品表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{admin/fragments :: navbar}"></nav>

    <div class="container mt-4">
        <h2 class="mb-4" th:text="${product.id} ? '编辑商品' : '新增商品'">商品表单</h2>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="mb-3">
                                <label class="form-label">商品名称</label>
                                <input type="text" th:field="*{name}" class="form-control" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">商品价格</label>
                                <input type="number" th:field="*{price}" class="form-control" step="0.01" min="0.01" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">商品库存</label>
                                <input type="number" th:field="*{stock}" class="form-control" min="0" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">商品分类</label>
                                <select th:field="*{categoryId}" class="form-control">
                                    <option value="">请选择分类</option>
                                    <option th:each="category : ${categories}" 
                                            th:value="${category.id}" 
                                            th:text="${category.name}">分类名称</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">商品描述</label>
                                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">商品图片URL</label>
                                <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="https://picsum.photos/150/120?random=1">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">商品状态</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" th:field="*{status}" value="1" id="status1">
                                    <label class="form-check-label" for="status1">上架</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" th:field="*{status}" value="0" id="status0">
                                    <label class="form-check-label" for="status0">下架</label>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">保存商品</button>
                                <a href="/admin/products" class="btn btn-secondary">返回商品列表</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
