<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- 后台导航栏片段 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:fragment="navbar">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/admin/index}">电商后台管理系统</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" 
                           th:classappend="${#request.requestURI == '/admin/index'} ? 'active'"
                           th:href="@{/admin/index}">数据看板</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" 
                           th:classappend="${#request.requestURI.startsWith('/admin/products')} ? 'active'"
                           th:href="@{/admin/products}">商品管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" 
                           th:classappend="${#request.requestURI == '/admin/categories'} ? 'active'"
                           th:href="@{/admin/categories}">分类管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" 
                           th:classappend="${#request.requestURI.startsWith('/admin/orders')} ? 'active'"
                           th:href="@{/admin/orders}">订单管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" 
                           th:classappend="${#request.requestURI == '/admin/users'} ? 'active'"
                           th:href="@{/admin/users}">用户管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" 
                           th:classappend="${#request.requestURI == '/admin/logs'} ? 'active'"
                           th:href="@{/admin/logs}">操作日志</a>
                    </li>
                </ul>
                <div class="navbar-nav">
                    <a class="nav-link" th:href="@{/admin/changePassword}">修改密码</a>
                    <a class="nav-link" th:href="@{/admin/logout}">退出登录</a>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- 激活状态样式：背景变色+字体变大+加粗 -->
    <style>
        .navbar-dark .navbar-nav .nav-link.active {
            background-color: #0d6efd;
            color: white !important;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            padding: 0.5rem 1rem;
        }
        .navbar-dark .navbar-nav .nav-link {
            margin: 0 0.25rem;
            padding: 0.5rem 1rem;
            transition: all 0.2s ease;
        }
        .navbar-dark .navbar-nav .nav-link:hover {
            background-color: rgba(13, 110, 253, 0.2);
            border-radius: 5px;
        }
    </style>
</body>
</html>
