<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="admin-navbar" th:fragment="navbar">
        <div class="admin-navbar-inner">
            <a class="admin-navbar-brand" th:href="@{/admin/index}">
                <div class="navbar-brand-icon" style="background: linear-gradient(135deg, #818cf8, #a78bfa);">C</div>
                <span>Commerce 后台</span>
            </a>
            <div class="admin-navbar-links">
                <a class="admin-nav-link" 
                   th:classappend="${#request.requestURI == '/admin/index'} ? 'active'"
                   th:href="@{/admin/index}">数据看板</a>
                <a class="admin-nav-link" 
                   th:classappend="${#request.requestURI.startsWith('/admin/products')} ? 'active'"
                   th:href="@{/admin/products}">商品管理</a>
                <a class="admin-nav-link" 
                   th:classappend="${#request.requestURI == '/admin/categories'} ? 'active'"
                   th:href="@{/admin/categories}">分类管理</a>
                <a class="admin-nav-link" 
                   th:classappend="${#request.requestURI.startsWith('/admin/orders')} ? 'active'"
                   th:href="@{/admin/orders}">订单管理</a>
                <a class="admin-nav-link" 
                   th:classappend="${#request.requestURI == '/admin/users'} ? 'active'"
                   th:href="@{/admin/users}">用户管理</a>
                <a class="admin-nav-link" 
                   th:classappend="${#request.requestURI == '/admin/logs'} ? 'active'"
                   th:href="@{/admin/logs}">操作日志</a>
                <a class="admin-nav-link" th:href="@{/admin/changePassword}">修改密码</a>
                <a class="admin-nav-link" th:href="@{/admin/logout}">退出登录</a>
            </div>
        </div>
    </nav>
</body>
</html>
