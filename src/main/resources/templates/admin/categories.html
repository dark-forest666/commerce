<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>分类管理 - Commerce 后台</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        
        @media (max-width: 768px) {
            .category-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav th:replace="~{admin/fragments :: navbar}"></nav>

    <div class="admin-content">
        <h2 style="margin-bottom: 24px;">商品分类管理</h2>
        
        <div class="category-grid">
            <div class="card">
                <div class="card-header">新增分类</div>
                <div class="card-body">
                    <form th:action="@{/admin/categories/save}" method="post">
                        <div class="form-group">
                            <label class="form-label">分类名称</label>
                            <input type="text" name="name" class="form-input" required placeholder="请输入分类名称">
                        </div>
                        <div class="form-group">
                            <label class="form-label">排序</label>
                            <input type="number" name="sort" class="form-input" value="0" min="0">
                            <span style="font-size: 0.8rem; color: var(--gray-400);">数字越小越靠前</span>
                        </div>
                        <button type="submit" class="btn btn-primary">新增分类</button>
                    </form>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">已有分类</div>
                <div class="card-body">
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>分类名称</th>
                                    <th>排序</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="category : ${categories}">
                                    <td th:text="${category.id}">1</td>
                                    <td th:text="${category.name}">分类名称</td>
                                    <td th:text="${category.sort}">0</td>
                                    <td>
                                        <a th:href="@{/admin/categories/delete/{id}(id=${category.id})}" 
                                           class="btn btn-danger btn-sm" 
                                           onclick="return confirm('确定删除该分类吗？删除后商品将变为未分类')">删除</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
