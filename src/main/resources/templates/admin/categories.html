<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>分类管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{admin/fragments :: navbar}"></nav>

    <div class="container mt-4">
        <h2 class="mb-4">商品分类管理</h2>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">新增分类</div>
                    <div class="card-body">
                        <form th:action="@{/admin/categories/save}" method="post">
                            <div class="mb-3">
                                <label class="form-label">分类名称</label>
                                <input type="text" name="name" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">排序</label>
                                <input type="number" name="sort" class="form-control" value="0" min="0">
                                <div class="form-text">数字越小越靠前</div>
                            </div>
                            <button type="submit" class="btn btn-primary">新增分类</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">已有分类</div>
                    <div class="card-body">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>分类名称</th>
                                    <th>排序</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="category : ${categories}">
                                    <td th:text="${category.id}">1</td>
                                    <td th:text="${category.name}">分类名称</td>
                                    <td th:text="${category.sort}">0</td>
                                    <td>
                                        <a th:href="@{/admin/categories/delete/{id}(id=${category.id})}" 
                                           class="btn btn-sm btn-danger" 
                                           onclick="return confirm('确定删除该分类吗？删除后商品将变为未分类')">删除</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
