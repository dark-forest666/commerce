<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单详情 - Commerce 后台</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav th:replace="admin/fragments :: navbar"></nav>
    
    <div class="admin-content">
        <h2 style="margin-bottom: 24px;">订单详情</h2>
        
        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>
        
        <div class="card" style="margin-bottom: 20px;">
            <div class="card-header">订单基本信息</div>
            <div class="card-body">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                    <div>
                        <span style="color: var(--gray-500); font-size: 0.88rem;">订单号</span>
                        <div style="font-family: monospace; font-weight: 700;" th:text="${order.orderNo}"></div>
                    </div>
                    <div>
                        <span style="color: var(--gray-500); font-size: 0.88rem;">下单时间</span>
                        <div th:text="${#dates.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')}"></div>
                    </div>
                    <div>
                        <span style="color: var(--gray-500); font-size: 0.88rem;">订单状态</span>
                        <div>
                            <span th:if="${order.status == 0}" class="badge badge-warning">待支付</span>
                            <span th:if="${order.status == 1}" class="badge badge-primary">已支付</span>
                            <span th:if="${order.status == 2}" class="badge badge-info">已发货</span>
                            <span th:if="${order.status == 3}" class="badge badge-success">已完成</span>
                            <span th:if="${order.status == 4}" class="badge badge-secondary">已取消</span>
                        </div>
                    </div>
                    <div>
                        <span style="color: var(--gray-500); font-size: 0.88rem;">总金额</span>
                        <div style="font-weight: 700; color: var(--danger); font-size: 1.2rem;">￥<span th:text="${order.totalAmount}"></span></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card" style="margin-bottom: 20px;">
            <div class="card-header">收货信息</div>
            <div class="card-body">
                <div style="padding: 16px; background: var(--gray-50); border-radius: var(--radius-sm);">
                    <div style="font-weight: 600; margin-bottom: 8px;">
                        <span th:text="${order.address?.receiverName} ?: '无'"></span>
                        <span style="color: var(--gray-500); margin-left: 12px;" th:text="${order.address?.phone} ?: '无'"></span>
                    </div>
                    <div style="color: var(--gray-600);">
                        <span th:if="${order.address != null}">
                            <span th:text="${order.address.province}"></span>
                            <span th:text="${order.address.city}"></span>
                            <span th:text="${order.address.district}"></span>
                            <span th:text="${order.address.detail}"></span>
                        </span>
                        <span th:else>无</span>
                    </div>
                    <div style="margin-top: 8px;">
                        <span style="color: var(--gray-500); font-size: 0.88rem;">快递单号：</span>
                        <span th:text="${order.expressNo} ?: '未发货'"></span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card" style="margin-bottom: 20px;">
            <div class="card-header">商品明细</div>
            <div class="card-body">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>商品名称</th>
                                <th>单价</th>
                                <th>数量</th>
                                <th>小计</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${order.orderItems}">
                                <td th:text="${item.product.name}"></td>
                                <td>￥<span th:text="${item.price}"></span></td>
                                <td th:text="${item.quantity}"></td>
                                <td style="font-weight: 700; color: var(--danger);">￥<span th:text="${item.price * item.quantity}"></span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div th:if="${order.status == 1}" class="card" style="margin-bottom: 20px;">
            <div class="card-header">发货操作</div>
            <div class="card-body">
                <form method="post" action="/admin/orders/ship">
                    <input type="hidden" name="orderId" th:value="${order.id}">
                    <div class="form-group">
                        <label class="form-label">快递单号</label>
                        <input type="text" class="form-input" id="expressNo" name="expressNo" required placeholder="请输入快递单号">
                    </div>
                    <div class="form-group">
                        <label class="form-label">管理员备注</label>
                        <textarea class="form-textarea" id="adminRemark" name="adminRemark" rows="3" placeholder="请输入备注信息"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" onclick="return confirm('确定要发货吗？')">确认发货</button>
                </form>
            </div>
        </div>
        
        <div th:if="${order.adminRemark != null}" class="card" style="margin-bottom: 20px;">
            <div class="card-header">管理员备注</div>
            <div class="card-body">
                <p th:text="${order.adminRemark}"></p>
            </div>
        </div>
        
        <div style="margin-top: 24px;">
            <a href="/admin/orders" class="btn btn-secondary">返回订单列表</a>
        </div>
    </div>
</body>
</html>
