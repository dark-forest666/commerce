<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单详情 - 电商后台管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- 引入后台导航栏 -->
    <div th:replace="admin/fragments :: navbar"></div>
    
    <div class="container mt-4">
        <h2 class="mb-4">订单详情</h2>
        
        <!-- 提示信息 -->
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>
        
        <!-- 订单基础信息 -->
        <div class="card mb-4">
            <div class="card-header">订单基本信息</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>订单号：</strong><span th:text="${order.orderNo}"></span></p>
                        <p><strong>下单时间：</strong><span th:text="${#dates.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
                        <p><strong>订单状态：</strong>
                            <span th:switch="${order.status}" class="badge">
                                <span th:case="0" class="bg-warning">待支付</span>
                                <span th:case="1" class="bg-primary">已支付</span>
                                <span th:case="2" class="bg-info">已发货</span>
                                <span th:case="3" class="bg-success">已完成</span>
                                <span th:case="4" class="bg-secondary">已取消</span>
                            </span>
                        </p>
                        <p><strong>总金额：</strong>¥<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>收货人：</strong><span th:text="${order.address?.receiverName} ?: '无'"></span></p>
                        <p><strong>手机号：</strong><span th:text="${order.address?.phone} ?: '无'"></span></p>
                        <p><strong>收货地址：</strong>
                            <span th:if="${order.address != null}">
                                <span th:text="${order.address.province}"></span>
                                <span th:text="${order.address.city}"></span>
                                <span th:text="${order.address.district}"></span>
                                <span th:text="${order.address.detail}"></span>
                            </span>
                            <span th:else>无</span>
                        </p>
                        <p><strong>快递单号：</strong><span th:text="${order.expressNo} ?: '未发货'"></span></p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 商品明细 -->
        <div class="card mb-4">
            <div class="card-header">商品明细</div>
            <div class="card-body">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>商品名称</th>
                            <th>单价</th>
                            <th>数量</th>
                            <th>小计</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${order.orderItems}">
                            <td th:text="${item.product.name}"></td>
                            <td>¥<span th:text="${#numbers.formatDecimal(item.price, 1, 2)}"></span></td>
                            <td th:text="${item.quantity}"></td>
                            <td>¥<span th:text="${#numbers.formatDecimal(item.price * item.quantity, 1, 2)}"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- 发货操作（仅已支付订单显示） -->
        <div th:if="${order.status == 1}" class="card">
            <div class="card-header">发货操作</div>
            <div class="card-body">
                <form method="post" action="/admin/orders/ship">
                    <input type="hidden" name="orderId" th:value="${order.id}">
                    <div class="mb-3">
                        <label for="expressNo" class="form-label">快递单号</label>
                        <input type="text" class="form-control" id="expressNo" name="expressNo" required>
                    </div>
                    <div class="mb-3">
                        <label for="adminRemark" class="form-label">管理员备注</label>
                        <textarea class="form-control" id="adminRemark" name="adminRemark" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" onclick="return confirm('确定要发货吗？')">确认发货</button>
                </form>
            </div>
        </div>
        
        <!-- 管理员备注 -->
        <div th:if="${order.adminRemark != null}" class="card mt-4">
            <div class="card-header">管理员备注</div>
            <div class="card-body">
                <p th:text="${order.adminRemark}"></p>
            </div>
        </div>
        
        <div class="mt-4">
            <a href="/admin/orders" class="btn btn-secondary">返回订单列表</a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
