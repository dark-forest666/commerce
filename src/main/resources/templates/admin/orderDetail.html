<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>订单详情</title>
</head>
<body>
<div th:replace="fragments :: navbar(${session.role})"></div>
<h2>订单详情</h2>
<p>订单号：<span th:text="${order.orderNo}"></span></p>
<p>状态：
  <span th:if="${order.status == 0}">待支付</span>
  <span th:if="${order.status == 1}">已支付</span>
  <span th:if="${order.status == 2}">已发货</span>
  <span th:if="${order.status == 3}">已完成</span>
  <span th:if="${order.status == 4}">已取消</span>
</p>
<p>创建时间：<span th:text="${#dates.format(order.createTime, 'yyyy-MM-dd HH:mm')}"></span></p>
<p>收货地址：<span th:text="${order.address.receiverName} + ' ' + ${order.address.phone}"></span><br/>
  <span th:text="${order.address.province} + ' ' + ${order.address.city} + ' ' + ${order.address.district} + ' ' + ${order.address.detail}"></span>
</p>
<h3>商品列表</h3>
<table border="1">
  <thead>
  <tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th></tr>
  </thead>
  <tbody>
  <tr th:each="item : ${order.orderItems}">
    <td th:text="${item.product.name}"></td>
    <td th:text="'￥' + ${item.price}"></td>
    <td th:text="${item.quantity}"></td>
    <td th:text="'￥' + ${item.price * item.quantity}"></td>
  </tr>
  </tbody>
</table>
<p>总金额：￥<span th:text="${order.totalAmount}"></span></p>

<div th:if="${order.status == 0}">
  <form th:action="@{/order/mockPay}" method="post" style="display:inline;">
    <input type="hidden" name="orderId" th:value="${order.id}">
    <button type="submit">模拟支付</button>
  </form>
  <form th:action="@{/order/cancel}" method="post" style="display:inline;">
    <input type="hidden" name="orderId" th:value="${order.id}">
    <button type="submit" onclick="return confirm('确定取消订单吗？')">取消订单</button>
  </form>
</div>
<br/>
<a href="/order/myOrders">返回我的订单</a>
</body>
</html>
