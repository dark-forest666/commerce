<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单管理 - 电商后台管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="admin/fragments :: navbar"></div>
    
    <div class="container mt-4">
        <h2 class="mb-4">订单管理</h2>
        
        <!-- 提示信息 -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <!-- 统一表单 -->
        <form method="post" id="orderForm">
            <div class="row mb-3">
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="搜索订单号/收货人/手机号" 
                           name="keyword" th:value="${keyword}">
                </div>
                <div class="col-md-3">
                    <select class="form-select" name="status">
                        <option value="">全部状态</option>
                        <option value="0" th:selected="${status == 0}">待支付</option>
                        <option value="1" th:selected="${status == 1}">已支付</option>
                        <option value="2" th:selected="${status == 2}">已发货</option>
                        <option value="3" th:selected="${status == 3}">已完成</option>
                        <option value="4" th:selected="${status == 4}">已取消</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <button type="submit" class="btn btn-primary" formaction="/admin/orders">搜索</button>
                    <button type="submit" class="btn btn-success ms-2" formaction="/admin/orders/batchShip"
                            onclick="return confirm('确定批量发货选中的已支付订单吗？')">批量发货</button>
                </div>
            </div>
            
            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th width="5%">
                            <input type="checkbox" id="selectAll">
                        </th>
                        <th>订单号</th>
                        <th>用户ID</th>
                        <th>总金额</th>
                        <th>状态</th>
                        <th>下单时间</th>
                        <th width="10%">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td>
                            <input type="checkbox" name="ids" th:value="${order.id}" 
                                   th:disabled="${order.status != 1}">
                        </td>
                        <td th:text="${order.orderNo}"></td>
                        <td th:text="${order.user.id}"></td>
                        <td>¥<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span></td>
                        <td>
                            <span th:switch="${order.status}" class="badge">
                                <span th:case="0" class="bg-warning">待支付</span>
                                <span th:case="1" class="bg-primary">已支付</span>
                                <span th:case="2" class="bg-info">已发货</span>
                                <span th:case="3" class="bg-success">已完成</span>
                                <span th:case="4" class="bg-secondary">已取消</span>
                            </span>
                        </td>
                        <td th:text="${#dates.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
                        <td>
                            <a th:href="@{/admin/orders/detail/{id}(id=${order.id})}" 
                               class="btn btn-primary btn-sm">查看详情</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="7" class="text-center text-muted">暂无订单数据</td>
                    </tr>
                </tbody>
            </table>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 全选逻辑（仅启用已支付订单）
        document.getElementById('selectAll').addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('input[name="ids"]:not(:disabled)');
            checkboxes.forEach(cb => cb.checked = this.checked);
        });
    </script>
</body>
</html>
