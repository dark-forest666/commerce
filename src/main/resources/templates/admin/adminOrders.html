<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单管理 - Commerce 后台</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav th:replace="~{admin/fragments :: navbar}"></nav>

    <div class="admin-content">
        <h2 style="margin-bottom: 24px;">订单管理</h2>
        
        <div class="card" style="margin-bottom: 20px;">
            <div class="card-header">订单列表</div>
            <div class="card-body">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>订单号</th>
                                <th>总金额</th>
                                <th>状态</th>
                                <th>收货人</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td style="font-family: monospace; font-weight: 600;" th:text="${order.orderNo}"></td>
                                <td style="font-weight: 700; color: var(--danger);">￥<span th:text="${order.totalAmount}"></span></td>
                                <td>
                                    <span th:if="${order.status == 0}" class="badge badge-warning">待支付</span>
                                    <span th:if="${order.status == 1}" class="badge badge-primary">已支付</span>
                                    <span th:if="${order.status == 2}" class="badge badge-info">已发货</span>
                                    <span th:if="${order.status == 3}" class="badge badge-success">已完成</span>
                                    <span th:if="${order.status == 4}" class="badge badge-secondary">已取消</span>
                                </td>
                                <td th:text="${order.address?.receiverName} ?: '无'"></td>
                                <td th:text="${#dates.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
                                <td>
                                    <a th:href="@{/admin/orders/detail/{id}(id=${order.id})}" class="btn btn-primary btn-sm">查看详情</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
