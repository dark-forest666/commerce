<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>操作日志</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{admin/fragments :: navbar}"></nav>

    <div class="container mt-4">
        <h2 class="mb-4">管理员操作日志</h2>
        
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>日志ID</th>
                    <th>管理员ID</th>
                    <th>操作内容</th>
                    <th>操作IP</th>
                    <th>操作时间</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${log.id}">1</td>
                    <td th:text="${log.adminId}">1</td>
                    <td th:text="${log.operation}">操作内容</td>
                    <td th:text="${log.ipAddress}">127.0.0.1</td>
                    <td th:text="${#dates.format(log.createTime, 'yyyy-MM-dd HH:mm:ss')}">2026-06-11 12:00:00</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
