<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>操作日志 - Commerce 后台</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav th:replace="~{admin/fragments :: navbar}"></nav>

    <div class="admin-content">
        <h2 style="margin-bottom: 24px;">管理员操作日志</h2>
        
        <div class="card">
            <div class="card-header">日志列表</div>
            <div class="card-body">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>日志ID</th>
                                <th>管理员ID</th>
                                <th>操作内容</th>
                                <th>操作IP</th>
                                <th>操作时间</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="log : ${logs}">
                                <td th:text="${log.id}">1</td>
                                <td th:text="${log.adminId}">1</td>
                                <td th:text="${log.operation}">操作内容</td>
                                <td th:text="${log.ipAddress}">127.0.0.1</td>
                                <td th:text="${#dates.format(log.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
