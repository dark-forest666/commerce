<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>数据看板 - 电商后台管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .stat-card {
            padding: 1.5rem;
            border-radius: 8px;
            color: white;
            margin-bottom: 1rem;
        }
        .stat-card h3 {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0;
        }
        .stat-card p {
            margin: 0.5rem 0 0 0;
            font-size: 1.1rem;
        }
        .section-card {
            padding: 1rem;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- 引入后台导航栏（解决点击数据看板导航栏消失问题） -->
    <div th:replace="admin/fragments :: navbar"></div>
    
    <div class="container mt-4">
        <h2 class="mb-4">数据概览</h2>
        
        <!-- 顶部统计卡片 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-card bg-primary">
                    <h3 th:text="${totalNormalUsers}">0</h3>
                    <p>普通用户数</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card bg-secondary">
                    <h3 th:text="${totalAdminUsers}">0</h3>
                    <p>管理员数</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card bg-success">
                    <h3 th:text="${totalProducts}">0</h3>
                    <p>总商品数</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card bg-info">
                    <h3 th:text="${totalOrders}">0</h3>
                    <p>总订单数</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card bg-warning">
                    <h3>¥<span th:text="${#numbers.formatDecimal(totalSales, 1, 2)}">0.00</span></h3>
                    <p>总销售额</p>
                </div>
            </div>
        </div>
        
        <!-- 今日数据 + 待处理事项 -->
        <div class="row">
            <div class="col-md-4">
                <div class="section-card">
                    <h5 class="mb-3">今日数据</h5>
                    <p>今日新增用户：<span th:text="${todayNewUsers}">0</span></p>
                    <p>今日订单数：<span th:text="${todayOrders}">0</span></p>
                    <p>今日销售额：¥<span th:text="${#numbers.formatDecimal(todaySales, 1, 2)}">0.00</span></p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="section-card">
                    <h5 class="mb-3">待发货订单</h5>
                    <div th:each="order : ${pendingShipOrders}">
                        <a th:href="@{/admin/orders/detail/{id}(id=${order.id})}" 
                           th:text="${order.orderNo}" 
                           class="d-block mb-2"></a>
                    </div>
                    <div th:if="${#lists.isEmpty(pendingShipOrders)}">
                        <p class="text-muted">暂无待发货订单</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="section-card">
                    <h5 class="mb-3">库存预警商品</h5>
                    <div th:each="product : ${lowStockProducts}">
                        <p th:text="${product.name} + ' (库存：' + ${product.stock} + ')'" class="text-danger mb-2"></p>
                    </div>
                    <div th:if="${#lists.isEmpty(lowStockProducts)}">
                        <p class="text-muted">暂无库存预警商品</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
