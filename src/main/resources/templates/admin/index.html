<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>数据看板 - Commerce 后台</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .stat-card {
            padding: 24px;
            border-radius: var(--radius);
            color: white;
            margin-bottom: 20px;
            transition: var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-2px);
        }
        .stat-card h3 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0;
        }
        .stat-card p {
            margin: 8px 0 0 0;
            font-size: 0.95rem;
            opacity: 0.9;
        }
        .stat-card-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }
        .stat-card-secondary { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .stat-card-success { background: linear-gradient(135deg, var(--success), #059669); }
        .stat-card-info { background: linear-gradient(135deg, var(--info), #2563eb); }
        .stat-card-warning { background: linear-gradient(135deg, var(--warning), #d97706); }
        
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .stat-card h3 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <nav th:replace="admin/fragments :: navbar"></nav>
    
    <div class="admin-content">
        <h2 style="margin-bottom: 24px;">数据概览</h2>
        
        <div class="stat-grid">
            <div class="stat-card stat-card-primary">
                <h3 th:text="${totalNormalUsers}">0</h3>
                <p>普通用户数</p>
            </div>
            <div class="stat-card stat-card-secondary">
                <h3 th:text="${totalAdminUsers}">0</h3>
                <p>管理员数</p>
            </div>
            <div class="stat-card stat-card-success">
                <h3 th:text="${totalProducts}">0</h3>
                <p>总商品数</p>
            </div>
            <div class="stat-card stat-card-info">
                <h3 th:text="${totalOrders}">0</h3>
                <p>总订单数</p>
            </div>
            <div class="stat-card stat-card-warning">
                <h3>￥<span th:text="${totalSales}">0.00</span></h3>
                <p>总销售额</p>
            </div>
        </div>
        
        <div class="section-grid">
            <div class="card">
                <div class="card-header">今日数据</div>
                <div class="card-body">
                    <div style="padding: 8px 0; border-bottom: 1px solid var(--gray-100);">今日新增用户：<span style="font-weight: 700; color: var(--primary);" th:text="${todayNewUsers}">0</span></div>
                    <div style="padding: 8px 0; border-bottom: 1px solid var(--gray-100);">今日订单数：<span style="font-weight: 700; color: var(--primary);" th:text="${todayOrders}">0</span></div>
                    <div style="padding: 8px 0;">今日销售额：￥<span style="font-weight: 700; color: var(--danger);" th:text="${todaySales}">0.00</span></div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">待发货订单</div>
                <div class="card-body">
                    <div th:each="order : ${pendingShipOrders}" style="padding: 8px 0; border-bottom: 1px solid var(--gray-100);">
                        <a th:href="@{/admin/orders/detail/{id}(id=${order.id})}" th:text="${order.orderNo}" style="color: var(--primary); text-decoration: none; font-weight: 600;"></a>
                    </div>
                    <div th:if="${#lists.isEmpty(pendingShipOrders)}" style="color: var(--gray-400); text-align: center; padding: 16px;">暂无待发货订单</div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">库存预警商品</div>
                <div class="card-body">
                    <div th:each="product : ${lowStockProducts}" style="padding: 8px 0; border-bottom: 1px solid var(--gray-100);">
                        <span th:text="${product.name}" style="font-weight: 600;"></span>
                        <span style="color: var(--danger); margin-left: 8px;">库存：<span th:text="${product.stock}"></span></span>
                    </div>
                    <div th:if="${#lists.isEmpty(lowStockProducts)}" style="color: var(--gray-400); text-align: center; padding: 16px;">暂无库存预警商品</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
