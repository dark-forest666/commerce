<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密码 - Commerce 后台</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav th:replace="~{admin/fragments :: navbar}"></nav>

    <div class="admin-content">
        <h2 style="margin-bottom: 24px;">修改管理员密码</h2>
        
        <div class="card" style="max-width: 500px; margin: 0 auto;">
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger">
                    <span th:text="${error}"></span>
                </div>
                
                <form th:action="@{/admin/changePassword}" method="post">
                    <div class="form-group">
                        <label class="form-label">原密码</label>
                        <input type="password" name="oldPassword" class="form-input" required placeholder="请输入原密码">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">新密码</label>
                        <input type="password" name="newPassword" class="form-input" required minlength="6" placeholder="请输入新密码（至少6位）">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">确认新密码</label>
                        <input type="password" name="confirmPassword" class="form-input" required placeholder="请再次输入新密码">
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block" 
                            onclick="return document.getElementsByName('newPassword')[0].value == document.getElementsByName('confirmPassword')[0].value 
                            || (alert('两次输入的密码不一致！'), false)">确认修改</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
