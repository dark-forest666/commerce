<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密码</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{admin/fragments :: navbar}"></nav>

    <div class="container mt-4">
        <h2 class="mb-4">修改管理员密码</h2>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/admin/changePassword}" method="post">
                            <div class="mb-3">
                                <label class="form-label">原密码</label>
                                <input type="password" name="oldPassword" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">新密码</label>
                                <input type="password" name="newPassword" class="form-control" required minlength="6">
                                <div class="form-text">密码长度至少6位</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">确认新密码</label>
                                <input type="password" name="confirmPassword" class="form-control" required>
                            </div>
                            <p class="text-danger" th:if="${error}" th:text="${error}"></p>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary" 
                                        onclick="return document.getElementsByName('newPassword')[0].value == document.getElementsByName('confirmPassword')[0].value 
                                        || (alert('两次输入的密码不一致！'), false)">确认修改</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
